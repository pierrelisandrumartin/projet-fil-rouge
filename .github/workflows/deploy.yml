name: Deploy to VPS

on:
  push:
    branches: [feature/visual-refactor]
  workflow_dispatch:  # bouton manuel

jobs:
  deploy:
    name: Deploy to yomi-app.fr
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'bash -s' << 'DEPLOY'
            set -e
            cd ~/projet-fil-rouge

            echo "─── git pull ───────────────"
            git pull

            echo "─── backend rebuild ────────"
            docker compose up -d --build springboot

            echo "─── frontend build ─────────"
            cd frontend
            npm ci
            npm run build

            echo "─── copy to nginx ──────────"
            cp -r dist/* /var/www/yomi/

            echo "─── deploy complete ────────"
          DEPLOY