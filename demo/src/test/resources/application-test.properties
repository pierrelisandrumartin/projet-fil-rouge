# Base H2 en mémoire, mode MySQL pour la compatibilité SQL
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Recrée le schéma à chaque test — pas de résidu d'un test précédent
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Un JWT_SECRET dédié aux tests
jwt.secret=test-secret-that-is-long-enough-for-HS256-signing-algorithm-please
