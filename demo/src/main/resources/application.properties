spring.application.name=demo

# Connexion MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bdd_manga?useUnicode=true&characterEncoding=utf8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

logging.level.root=DEBUG
logging.level.org.springframework=DEBUG

spring.jackson.serialization.fail-on-empty-beans=false
jwt.secret=${JWT_SECRET:monSecretJWTTresLongPourEtreSecurise1234567890ABCDEF}

server.port=${PORT:8080}

# CORS — origines autorisées (dev local par défaut, override par env var en prod)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}